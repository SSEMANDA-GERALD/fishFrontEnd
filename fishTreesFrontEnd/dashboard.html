<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Your FishTrees Pathways account and report history.">
  <title>Account Dashboard | FishTrees Pathways</title>
  <link rel="icon" type="image/png" href="images/FishTrees Pathways Logo.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="css/accounts.css">
</head>
<body>
  <header data-page="account"></header>
  <main class="account-shell account-shell-wide dashboard-shell">
    <section class="account-heading dashboard-heading">
      <div>
        <p class="account-eyebrow">Account workspace</p>
        <h1 id="dashboardTitle">Dashboard</h1>
        <p id="accountDescriptor">School account workspace</p>
      </div>
      <button id="signoutButton" class="text-action" type="button">Sign out</button>
    </section>
    <section id="approvalNotice" class="account-notice" hidden></section>
    <section id="dashboardContent" hidden>
      <div class="account-stat-grid">
        <article class="account-stat"><span>Predictions</span><strong id="predictionCount">0</strong></article>
        <article class="account-stat"><span>Requests completed</span><strong id="completedOrderCount">0</strong></article>
        <article class="account-stat"><span>Orders</span><strong id="orderCount">0</strong></article>
      </div>
      <nav class="dashboard-actions" aria-label="Account actions">
        <a id="individualLink" class="account-action" href="recommendations.html">Single prediction</a>
        <a id="bulkLink" class="account-action" href="schools.html">Bulk predictions</a>
      </nav>
      <p class="account-note">Recommendation previews are illustrative. No payment is processed.</p>
      <section class="dashboard-section">
        <div class="dashboard-section-heading">
          <div>
            <p class="account-eyebrow">Orders</p>
            <h2>Recommendation history</h2>
          </div>
          <button id="refreshDashboard" class="text-action" type="button">Refresh</button>
        </div>
        <div id="ordersList" class="orders-list"></div>
      </section>
    </section>
    <p id="dashboardStatus" class="account-status" role="status" aria-live="polite"></p>
  </main>
  <footer class="home-footer text-center py-4">&copy; 2026 FishTrees Pathways. All rights reserved.</footer>
  <script src="js/demo-store.js"></script>
  <script src="js/navbar.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
