<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign in to your FishTrees Pathways account.">
  <title>Sign In | FishTrees Pathways</title>
  <link rel="icon" type="image/png" href="images/FishTrees Pathways Logo.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="css/accounts.css">
</head>
<body>
  <header data-page="account"></header>
  <main class="account-shell">
    <section class="account-heading">
      <p class="account-eyebrow">Account access</p>
      <h1>Sign in</h1>
      <p>Access your student or institution workspace.</p>
    </section>
    <form id="signinForm" class="account-form">
      <label for="identifier">Email or username</label>
      <input id="identifier" name="identifier" type="text" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <label class="account-check"><input id="remember" type="checkbox"> Keep me signed in on this device</label>
      <button class="account-primary" type="submit">Sign in</button>
      <p id="signinStatus" class="account-status" role="status" aria-live="polite"></p>
      <p class="account-switch">New here? <a href="signup.html">Request an account</a></p>
    </form>
  </main>
  <footer class="home-footer text-center py-4">&copy; 2026 FishTrees Pathways. All rights reserved.</footer>
  <script src="js/navbar.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/signin.js"></script>
</body>
</html>
