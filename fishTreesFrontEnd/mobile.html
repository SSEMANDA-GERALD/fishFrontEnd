<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Preview the simulated mobile-money checkout.">
  <title>Mobile Money Demo | FishTrees Pathways</title>
  <link rel="icon" type="image/png" href="images/FishTrees Pathways Logo.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="css/payment-bootstrap.css">
</head>
<body data-payment-method="mobile-money">
  <header data-page="payment"></header>
  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-6">
        <a id="methodReturn" href="payment.html" class="d-inline-block text-forest text-decoration-none fw-semibold mb-3">Back to payment methods</a>
        <section class="card border-0 border-top border-4 border-forest shadow-sm">
          <div class="card-body p-4">
            <p class="eyebrow mb-2">Mobile money</p>
            <h1 class="h3 text-forest">Preview mobile money checkout</h1>
            <p class="alert alert-warning">Presentation simulation only. No mobile-money prompt is sent and no money is transferred. Never enter a PIN or transaction reference.</p>
            <p class="price-line border-top border-bottom py-3 mb-3"><span class="fw-bold text-forest">UGX</span><strong id="methodAmount" class="display-6 text-forest">500</strong><span>total due</span></p>
            <p id="methodOrderSummary" class="small text-secondary"></p>
            <form id="demoPaymentForm">
              <fieldset class="mb-3">
                <legend class="fs-6 fw-semibold mb-2">Select network used</legend>
                <div class="d-flex gap-3">
                  <label class="form-check border rounded p-3 flex-fill" for="mtnNetwork"><input class="form-check-input" id="mtnNetwork" type="radio" name="network" value="mtn" checked><span class="form-check-label fw-semibold">MTN MoMo</span></label>
                  <label class="form-check border rounded p-3 flex-fill" for="airtelNetwork"><input class="form-check-input" id="airtelNetwork" type="radio" name="network" value="airtel"><span class="form-check-label fw-semibold">Airtel Money</span></label>
                </div>
              </fieldset>
              <button class="btn btn-forest w-100" type="submit">Simulate demo payment</button>
              <p id="demoPaymentStatus" class="small text-secondary mt-2 mb-0" role="status" aria-live="polite"></p>
            </form>
          </div>
        </section>
      </div>
    </div>
  </main>
  <footer class="home-footer text-center py-4">&copy; 2026 FishTrees Pathways. All rights reserved.</footer>
  <script src="js/navbar.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/demo-store.js"></script>
  <script src="js/payment-method.js"></script>
</body>
</html>
